name: prek-action
description: Run pre-commit hooks using prek
inputs:
  extra-args:
    description: Extra options to pass to `prek run`, appended after `--show-diff-on-failure --color=always`
    required: false
    default: "--all-files"
  extra_args:
    description: Options to pass to `prek run` (deprecated, use extra-args)
    deprecationMessage: The extra_args input has been renamed to extra-args. Update your workflow.
    required: false
  cache:
    description: Whether to cache the prek environment between workflow runs
    required: false
    default: "true"
  install-only:
    description: Only install prek, do not run it
    required: false
    default: "false"
  prek-version:
    description: Version or semver range of prek to install (for example `0.2.1`, `0.3.x`, `<=1.0.0`, `latest`, or `latest-known`). Takes precedence over `prek-version-file`. When unset, the version is read from `prek-version-file`, otherwise `latest`
    required: false
    default: ""
  prek-version-file:
    description: Path, relative to `working-directory`, to a `.tool-versions` file to read the prek version from when `prek-version` is unset. Its `uv` entry, if present, sets `PREK_UV_VERSION` so prek installs that uv version, unless `uv-version` is set. The default file is optional; any other path must exist and declare `prek`
    required: false
    default: ".tool-versions"
  uv-version:
    description: Exact uv version for prek to install for Python hooks (for example `0.9.5`), exported as `PREK_UV_VERSION`. Overrides the `uv` entry from `prek-version-file` and an existing `PREK_UV_VERSION`, and applies even when `prek-version` is set
    required: false
    default: ""
  sha256:
    description: SHA-256 checksum of the prek release archive; overrides the bundled checksum
    required: false
  show-verbose-logs:
    description: Whether to print the prek verbose log after `prek run`
    required: false
    default: "true"
  working-directory:
    description: The working directory to run prek in
    required: false
    default: "."
  token:
    description: Unused; retained for backward compatibility
    deprecationMessage: The token input is unused and will be removed in a future major version.
    required: false
    default: ""
outputs:
  prek-version:
    description: The version of prek that was installed
  cache-hit:
    description: Whether the prek environment cache was an exact match
runs:
  using: node24
  main: dist/index.cjs
  post: dist/index.cjs
branding:
  icon: git-commit
  color: orange
