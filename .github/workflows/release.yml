name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with or without the leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Rebuild dist
        run: npm run bundle

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Plan release
        id: plan
        run: |
          release_tag="${INPUT_VERSION#v}"
          release_tag="v${release_tag}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version input: ${INPUT_VERSION}" >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag already exists: ${release_tag}" >&2
            exit 1
          fi
          is_prerelease=false
          if [[ "$release_tag" == *-* ]]; then
            is_prerelease=true
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "Planned release:"
          echo "  tag: ${release_tag}"
          echo "  prerelease: ${is_prerelease}"

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          IS_PRERELEASE: ${{ steps.plan.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--target "${GITHUB_SHA}" --generate-notes)
          if [[ "${IS_PRERELEASE}" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${args[@]}"
