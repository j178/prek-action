default_install_hook_types: [pre-push]
exclude: ^dist/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/biomejs/pre-commit
    rev: 64c481773cdeda96800dac9ee8f8740e373e44ce  # frozen: v2.6.7
    hooks:
      - id: biome-check
