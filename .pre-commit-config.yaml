default_install_hook_types: [pre-push]
exclude: ^dist/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/biomejs/pre-commit
    rev: 5090c1e080cc8cec15feee68a9355c0f660d3712  # frozen: v2.5.15
    hooks:
      - id: biome-check
