default_install_hook_types: [pre-push]
exclude: ^dist/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/biomejs/pre-commit
    rev: 2a24170fd6adbd6fb1463868533368fe9c01a04d  # frozen: v2.6.6
    hooks:
      - id: biome-check
